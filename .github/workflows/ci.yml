name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Redis backends against a real Redis
        run: python -m pytest -q tests/test_redis.py
        env: { TEST_REDIS_URL: "redis://localhost:6379/0" }

  postgres:
    # The whole backend suite again, with app data and the audit log in PostgreSQL.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-password-123, POSTGRES_DB: ie_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env: { TEST_DATABASE_URL: "postgresql://postgres:ci-password-123@localhost:5432/ie_test" }

  integrations:
    # Optional backends against real services: S3 Object Lock (moto S3 server) and Neo4j.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      neo4j:
        image: neo4j:5
        env: { NEO4J_AUTH: "neo4j/ci-password-123" }
        ports: ["17687:7687", "17474:7474"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt "moto[server]"
      - name: WORM export against an S3 server with Object Lock (moto)
        run: |
          moto_server -H 127.0.0.1 -p 19000 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:19000/moto-api/ >/dev/null && break; sleep 1; done
          python -m pytest -q tests/test_exporters.py -k real_object_lock -rs
        env:
          TEST_S3_ENDPOINT: "http://127.0.0.1:19000"
          AWS_ACCESS_KEY_ID: ciuser
          AWS_SECRET_ACCESS_KEY: ci-password-123
      - name: Evidence graph push into Neo4j
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:17474 >/dev/null && break; sleep 2; done
          python -m pytest -q tests/test_graph_export.py -k real_neo4j -rs
        env:
          TEST_NEO4J_URI: "bolt://localhost:17687"
          TEST_NEO4J_PASSWORD: ci-password-123

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx eslint src e2e playwright.config.ts
      - run: npx tsc --noEmit
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  docker:
    # Builds the exact images Railway builds, runs them as a pair on a private network, and smoke-tests them.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ie-backend backend
      - run: docker build -t ie-frontend frontend
      - name: Run containers
        run: |
          docker network create ie
          docker run -d --name backend --network ie -e MOCK_MODE=1 -e PORT=8000 \
            -e JWT_SECRET=ci-secret-0123456789-0123456789-0123456789 ie-backend
          docker run -d --name frontend --network ie -p 3000:3000 -e BACKEND_URL=http://backend:8000 ie-frontend
      - name: Smoke test
        run: |
          fail() { echo "::error title=smoke test::$1"; exit 1; }
          for i in $(seq 1 30); do
            docker exec backend python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health')" 2>/dev/null && break
            sleep 2
          done
          docker exec backend python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health')" || fail "backend health"
          for i in $(seq 1 30); do curl -fs http://localhost:3000/login >/dev/null && break; sleep 2; done
          curl -fs http://localhost:3000/login | grep -q "Identity Evidence" || fail "frontend /login"
          curl -fs http://localhost:3000/api/health | grep -q '"mode":"mock"' || fail "frontend -> backend proxy"
          [ "$(docker exec backend id -u)" != "0" ] || fail "backend runs as root"
          [ "$(docker exec frontend id -u)" != "0" ] || fail "frontend runs as root"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' http://localhost:3000/bff/login)
          [ "$code" = "403" ] || fail "BFF cross-origin check returned $code"
      - name: Container logs as annotations (visible without repo admin rights)
        if: failure()
        run: |
          for c in backend frontend; do
            logs=$(docker logs "$c" 2>&1 | tail -40 | tr -d '\r' | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}')
            echo "::error title=$c logs::$logs"
          done

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend venv (used by the Playwright web server)
        run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: frontend/test-results, retention-days: 7 }
