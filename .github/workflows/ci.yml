name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Redis backends against a real Redis
        run: python -m pytest -q tests/test_redis.py
        env: { TEST_REDIS_URL: "redis://localhost:6379/0" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx eslint src e2e playwright.config.ts
      - run: npx tsc --noEmit
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  docker:
    # Builds the exact images Railway builds, runs them as a pair on a private network, and smoke-tests them.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ie-backend backend
      - run: docker build -t ie-frontend frontend
      - name: Run containers
        run: |
          docker network create ie
          docker run -d --name backend --network ie -e MOCK_MODE=1 -e PORT=8000 \
            -e JWT_SECRET=ci-secret-0123456789-0123456789-0123456789 ie-backend
          docker run -d --name frontend --network ie -p 3000:3000 -e BACKEND_URL=http://backend:8000 ie-frontend
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fs http://localhost:3000/login >/dev/null && break; sleep 2; done
          curl -fs http://localhost:3000/login | grep -q "Identity Evidence"
          curl -fs http://localhost:3000/api/health | grep -q '"mode":"mock"'
          # container runs as a non-root user
          test "$(docker exec backend id -u)" != "0"
          test "$(docker exec frontend id -u)" != "0"
          # BFF refuses cross-origin session calls
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' http://localhost:3000/bff/login)" = "403"
      - if: failure()
        run: docker logs backend; docker logs frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend venv (used by the Playwright web server)
        run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: frontend/test-results, retention-days: 7 }
